name: CodeQL scanning

on:
    push:
        branches:
            - 'trunk'
    pull_request:
        # The branches below must be a subset of the branches above
        branches:
            - 'trunk'
    schedule:
        - cron: '0 8 * * 2'

jobs:
    # Performs a code analysis using CodeQL.
    #
    # Performs the following steps:
    # - Checks out the repository.
    # - Initializes CodeQL.
    # - Performs CodeQL analysis.
    analyze:
        name: Analyze
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write

        strategy:
            fail-fast: false
            matrix:
                language: ['javascript']

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # Initializes the CodeQL tools for scanning.
            - name: Initialize CodeQL
              uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
              with:
                  languages: ${{ matrix.language }}
                  config-file: ./.github/codeql/codeql-config.yml

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
