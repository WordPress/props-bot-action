name: 'WordPress Props'
description: 'Leaves a list of all contributors associated with a pull request and linked issues in a comment for use within merge commits messages.'
inputs:
    format:
        description: 'Format of the message. use `git`, `svn`, `all`, or a comma separated combination of those.'
        required: false
        default: 'git'
    post-comment:
        description: 'Whether to post the generated list of props as a comment. No comment is posted when `false`, the message is only returned through the `comment-body` output.'
        required: false
        default: 'true'
    token:
        description: 'GitHub token. Requires `pull-requests: read` permission, or `write` when `post-comment` is `true`. On a private repository, it additionally requires `issues: read` permission.'
        required: true
        default: ${{ github.token }}
outputs:
    comment-body:
        description: 'The fully rendered props message in the `format` specified. Empty when no contributors were found.'
runs:
    using: 'node24'
    main: 'dist/index.js'
